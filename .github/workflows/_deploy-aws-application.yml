name: deploy-aws-application-reusable

on:
  workflow_call:
    inputs:
      application:
        description: Logical application workspace
        required: true
        type: string
      environment:
        description: GitHub and AWS environment
        required: true
        type: string
      sha:
        description: Full commit SHA to deploy
        required: true
        type: string
      operation:
        description: Deployment operation recorded in GitHub
        required: true
        type: string
      source:
        description: Human-readable source such as main or a release tag
        required: true
        type: string

concurrency:
  group: deploy-${{ inputs.application }}-${{ inputs.environment }}
  cancel-in-progress: ${{ inputs.environment == 'dev' }}

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      MCC_DEV_ACCOUNT_ID: ${{ inputs.environment == 'dev' && vars.AWS_ACCOUNT_ID || '' }}
      MCC_PROD_ACCOUNT_ID: ${{ inputs.environment == 'prod' && vars.AWS_ACCOUNT_ID || '' }}
      MCC_EMAIL_DOMAIN: ${{ vars.MCC_EMAIL_DOMAIN }}
    steps:
      - name: Validate deployment request
        env:
          APPLICATION: ${{ inputs.application }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          case "${APPLICATION}" in
            admin|data-pipeline|match-to-csv|ocr-quality|player) ;;
            *)
              echo "::error::Unsupported application: ${APPLICATION}"
              exit 1
              ;;
          esac
          case "${DEPLOYMENT_ENVIRONMENT}" in
            dev|prod) ;;
            *)
              echo "::error::Unsupported environment: ${DEPLOYMENT_ENVIRONMENT}"
              exit 1
              ;;
          esac
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Deployment SHA must contain 40 lowercase hexadecimal characters"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
      - name: Verify checked-out revision
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: docker/setup-qemu-action@v3
        if: inputs.application == 'match-to-csv'
        with:
          platforms: arm64
      - run: npm ci
      - name: Read release metadata
        id: release-metadata
        env:
          APPLICATION: ${{ inputs.application }}
        run: |
          METADATA="$(npm run release:metadata --silent -- --application "${APPLICATION}")"
          echo "metadata=${METADATA}" >> "${GITHUB_OUTPUT}"
      - name: Test selected application
        run: npm test --workspace "@mcc/${{ inputs.application }}"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CDK_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify target account
        run: |
          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          if [ "${ACTUAL_ACCOUNT}" != "${{ vars.AWS_ACCOUNT_ID }}" ]; then
            echo "::error::AWS credentials target the wrong account"
            exit 1
          fi
      - name: Verify match-to-csv prerequisites
        if: inputs.application == 'match-to-csv'
        run: |
          if [ -z "${MCC_EMAIL_DOMAIN}" ]; then
            echo "::error::The selected GitHub Environment has no inbound domain configured"
            exit 1
          fi
          PARAMETER_COUNT="$(aws ssm get-parameters \
            --names \
              /cdk-bootstrap/hnb659fds/version \
              "/mcc/${{ inputs.environment }}/match-to-csv/raw-email-bucket-name" \
              "/mcc/${{ inputs.environment }}/match-to-csv/evidence-bucket-name" \
              "/mcc/${{ inputs.environment }}/match-to-csv/data-key-arn" \
            --query 'length(Parameters)' \
            --output text)"
          if [ "${PARAMETER_COUNT}" != "4" ]; then
            echo "::error::CDK bootstrap or match-to-csv foundation parameters are missing"
            exit 1
          fi
          IDENTITY_STATUS="$(aws ses get-identity-verification-attributes \
            --identities "${MCC_EMAIL_DOMAIN}" \
            --query 'VerificationAttributes.*.VerificationStatus | [0]' \
            --output text)"
          if [ "${IDENTITY_STATUS}" != "Success" ]; then
            echo "::error::The configured SES identity is not verified in the deployment region"
            exit 1
          fi
          if ! dig +short MX "${MCC_EMAIL_DOMAIN}" | \
            grep -Fq "inbound-smtp.${AWS_REGION}.amazonaws.com."; then
            echo "::error::The configured MX record does not target SES inbound receiving in the deployment region"
            exit 1
          fi
      - name: Synthesize
        run: |
          npm run app:synth -- \
            "${{ inputs.application }}" \
            --environment "${{ inputs.environment }}"
      - name: Verify native Lambda bundles
        if: inputs.application == 'match-to-csv'
        run: npm run verify:bundle --workspace @mcc/match-to-csv
      - name: Reviewable production diff
        if: inputs.environment == 'prod'
        run: |
          npm run app:diff -- \
            "${{ inputs.application }}" \
            --environment prod
      - name: Create exact-revision deployment record
        id: deployment
        uses: actions/github-script@v9
        env:
          APPLICATION: ${{ inputs.application }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_OPERATION: ${{ inputs.operation }}
          DEPLOYMENT_SOURCE: ${{ inputs.source }}
          RELEASE_METADATA: ${{ steps.release-metadata.outputs.metadata }}
          TARGET_SHA: ${{ inputs.sha }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const response = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: process.env.TARGET_SHA,
              task: `deploy:${process.env.APPLICATION}`,
              auto_merge: false,
              required_contexts: [],
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              description: `${process.env.DEPLOYMENT_OPERATION} ${process.env.APPLICATION} from ${process.env.DEPLOYMENT_SOURCE}`,
              transient_environment: false,
              production_environment: process.env.DEPLOYMENT_ENVIRONMENT === 'prod',
              payload: {
                application: process.env.APPLICATION,
                operation: process.env.DEPLOYMENT_OPERATION,
                release: JSON.parse(process.env.RELEASE_METADATA),
                source: process.env.DEPLOYMENT_SOURCE,
                workflowRun: runUrl,
              },
            });
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: response.data.id,
              state: 'in_progress',
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              description: 'CDK deployment is running',
              log_url: runUrl,
              auto_inactive: false,
            });
            return response.data.id;
      - name: Deploy
        id: deploy
        run: |
          npm run app:deploy -- \
            "${{ inputs.application }}" \
            --environment "${{ inputs.environment }}" \
            --require-approval never
      - name: Verify deployed stack
        id: verify
        env:
          APPLICATION: ${{ inputs.application }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          STACK_NAME="${APPLICATION}-${DEPLOYMENT_ENVIRONMENT}"
          STACK_STATUS="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].StackStatus' \
            --output text)"
          case "${STACK_STATUS}" in
            CREATE_COMPLETE|UPDATE_COMPLETE|IMPORT_COMPLETE) ;;
            *)
              echo "::error::${STACK_NAME} has unexpected status ${STACK_STATUS}"
              exit 1
              ;;
          esac

          if [ "${APPLICATION}" = "match-to-csv" ]; then
            FUNCTIONS="$(aws cloudformation list-stack-resources \
              --stack-name "${STACK_NAME}" \
              --query "StackResourceSummaries[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" \
              --output text)"
            if [ -z "${FUNCTIONS}" ] || [ "${FUNCTIONS}" = "None" ]; then
              echo "::error::${STACK_NAME} has no Lambda functions"
              exit 1
            fi
            for FUNCTION_NAME in ${FUNCTIONS}; do
              read -r STATE UPDATE_STATUS <<<"$(aws lambda get-function-configuration \
                --function-name "${FUNCTION_NAME}" \
                --query '[State,LastUpdateStatus]' \
                --output text)"
              if [ "${STATE}" != "Active" ] || [ "${UPDATE_STATUS}" != "Successful" ]; then
                echo "::error::Lambda ${FUNCTION_NAME} is ${STATE}/${UPDATE_STATUS}"
                exit 1
              fi
            done

            STATE_MACHINES="$(aws cloudformation list-stack-resources \
              --stack-name "${STACK_NAME}" \
              --query "StackResourceSummaries[?ResourceType=='AWS::StepFunctions::StateMachine'].PhysicalResourceId" \
              --output text)"
            if [ -z "${STATE_MACHINES}" ] || [ "${STATE_MACHINES}" = "None" ]; then
              echo "::error::${STACK_NAME} has no Step Functions state machines"
              exit 1
            fi
            for STATE_MACHINE_ARN in ${STATE_MACHINES}; do
              test "$(aws stepfunctions describe-state-machine \
                --state-machine-arn "${STATE_MACHINE_ARN}" \
                --query status \
                --output text)" = "ACTIVE"
            done
          fi
      - name: Finish deployment record
        if: ${{ always() && steps.deployment.outputs.result != '' }}
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.result }}
          DEPLOYMENT_STATE: ${{ steps.deploy.outcome == 'success' && steps.verify.outcome == 'success' && 'success' || 'failure' }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: process.env.DEPLOYMENT_STATE,
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              description: process.env.DEPLOYMENT_STATE === 'success'
                ? 'CDK deployment and stack verification succeeded'
                : 'CDK deployment or stack verification failed',
              log_url: runUrl,
              auto_inactive: false,
            });
      - name: Write deployment summary
        if: always()
        env:
          APPLICATION: ${{ inputs.application }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_OPERATION: ${{ inputs.operation }}
          DEPLOYMENT_SOURCE: ${{ inputs.source }}
          RELEASE_METADATA: ${{ steps.release-metadata.outputs.metadata }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          {
            echo "## Deployment"
            echo
            echo "- Application: \`${APPLICATION}\`"
            echo "- Environment: \`${DEPLOYMENT_ENVIRONMENT}\`"
            echo "- Operation: \`${DEPLOYMENT_OPERATION}\`"
            echo "- Source: \`${DEPLOYMENT_SOURCE}\`"
            echo "- Commit: \`${TARGET_SHA}\`"
            echo "- Versions: \`${RELEASE_METADATA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
