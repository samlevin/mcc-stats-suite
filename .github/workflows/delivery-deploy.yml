# The CDK entry role trusts _delivery-deploy-environment.yml by its path in the
# OIDC job_workflow_ref claim, not by this workflow's name, so renaming this file
# or changing its name: needs no bootstrap change. Moving or renaming the
# reusable file needs bootstrap applied first.
name: 'Delivery: deploy to dev'
run-name: Deploy ${{ github.event.workflow_run.head_sha }} to dev

on:
  workflow_run:
    workflows: ['CI: checks']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  select-applications:
    name: Select applications from CI
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      applications: ${{ steps.selection.outputs.applications }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download application selection
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deploy-applications-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: selection
      - name: Validate application selection
        id: selection
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node -e '
            const fs = require("node:fs");
            const allowed = ["admin", "data-pipeline", "match-to-csv", "ocr-quality", "player"];
            const applications = JSON.parse(fs.readFileSync("selection/applications.json", "utf8"));
            if (!Array.isArray(applications) || applications.some((app) => !allowed.includes(app)) || new Set(applications).size !== applications.length) {
              throw new Error("Invalid affected application list");
            }
            if (!/^[0-9a-f]{40}$/.test(process.env.TARGET_SHA)) {
              throw new Error("Invalid CI commit SHA");
            }
            fs.writeFileSync("selection/source.json", JSON.stringify({
              ciRunId: Number(process.env.SOURCE_RUN_ID),
              ciRunAttempt: Number(process.env.SOURCE_RUN_ATTEMPT),
              sha: process.env.TARGET_SHA,
            }));
            applications.sort();
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `applications=${JSON.stringify(applications)}\n`);
          '
      - name: Upload dev source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: selection/source.json
          retention-days: 7

  deliver:
    name: Deploy ${{ matrix.application }} to dev
    needs: select-applications
    if: needs.select-applications.outputs.applications != '[]'
    strategy:
      fail-fast: false
      matrix:
        application: ${{ fromJSON(needs.select-applications.outputs.applications) }}
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
    uses: ./.github/workflows/_delivery-deploy-environment.yml
    with:
      application: ${{ matrix.application }}
      environment: dev
      operation: continuous-delivery
      source: main
      sha: ${{ needs.select-applications.outputs.sha }}
    secrets:
      DEV_AWS_ACCOUNT_ID: ${{ secrets.DEV_AWS_ACCOUNT_ID }}
