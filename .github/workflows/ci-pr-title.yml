# Requires a Conventional Commits PR title. The squash commit takes the title,
# and Release Please derives versions and release notes from it.

name: 'CI: PR title'

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

jobs:
  # The main ruleset requires this job's check, "Check PR title / Check PR
  # title follows Conventional Commits".
  check-pr-title:
    name: Check PR title
    uses: agenticool/agenticool/.github/workflows/ci-pr-title.yml@workflow-lint-v0.1.0
