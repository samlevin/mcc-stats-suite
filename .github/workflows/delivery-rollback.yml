# The CDK entry role trusts _delivery-deploy-environment.yml by its path in the
# OIDC job_workflow_ref claim, not by this workflow's name, so renaming this file
# or changing its name: needs no bootstrap change. Moving or renaming the
# reusable file needs bootstrap applied first.
name: 'Delivery: roll back prod'
run-name: Roll back ${{ inputs.application }} in prod to ${{ inputs.release-tag }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Restore a previous production release
        required: true
        type: choice
        options:
          - rollback
      application:
        description: Logical application workspace
        required: true
        type: choice
        options:
          - admin
          - data-pipeline
          - match-to-csv
          - ocr-quality
          - player
      release-tag:
        description: App release tag, for example match-to-csv-v1.2.3
        required: true
        type: string
      reason:
        description: Reason for restoring this production release
        required: true
        type: string

permissions:
  contents: read
  deployments: read

jobs:
  qualify-release:
    name: Qualify rollback release
    runs-on: ubuntu-latest
    outputs:
      release-url: ${{ steps.release.outputs.release-url }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Require main workflow definition
        run: test "${GITHUB_REF}" = "refs/heads/main"
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          APPLICATION: ${{ inputs.application }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        with:
          script: |
            const escapedApplication = process.env.APPLICATION.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const expectedTag = new RegExp(`^${escapedApplication}-v\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$`);
            if (!expectedTag.test(process.env.RELEASE_TAG)) {
              core.setFailed(`Release tag does not belong to ${process.env.APPLICATION}`);
              return;
            }
            const response = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag: process.env.RELEASE_TAG,
            });
            if (response.data.draft || response.data.prerelease) {
              core.setFailed('Production requires a published, non-prerelease GitHub Release');
              return;
            }
            core.setOutput('release-url', response.data.html_url);
      - name: Resolve immutable release revision
        id: target
        env:
          APPLICATION: ${{ inputs.application }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          TARGET_SHA="$(git rev-list -n 1 "${RELEASE_TAG}^{commit}")"
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release tag does not resolve to a commit"
            exit 1
          fi
          git merge-base --is-ancestor "${TARGET_SHA}" origin/main
          RELEASE_VERSION="${RELEASE_TAG#"${APPLICATION}-v"}"
          PACKAGE_VERSION="$(git show "${TARGET_SHA}:applications/${APPLICATION}/package.json" | node -e 'let input = ""; process.stdin.on("data", (data) => input += data); process.stdin.on("end", () => console.log(JSON.parse(input).version));')"
          if [ "${RELEASE_VERSION}" != "${PACKAGE_VERSION}" ]; then
            echo "::error::Release tag version ${RELEASE_VERSION} does not match ${APPLICATION} package version ${PACKAGE_VERSION}"
            exit 1
          fi
          npm run release:check
          echo "sha=${TARGET_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Require rollback reason
        if: inputs.operation == 'rollback'
        env:
          REASON: ${{ inputs.reason }}
        run: |
          if [ -z "${REASON// }" ]; then
            echo "::error::Explain why production is being rolled back"
            exit 1
          fi
      - name: Verify prior qualification
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          APPLICATION: ${{ inputs.application }}
          OPERATION: ${{ inputs.operation }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        with:
          script: |
            const environment = process.env.OPERATION === 'rollback' ? 'prod' : 'dev';
            const task = `deploy:${process.env.APPLICATION}`;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo,
              sha: process.env.TARGET_SHA,
              environment,
              task,
              per_page: 100,
            });
            const exactDeployments = deployments
              .filter((deployment) => deployment.sha === process.env.TARGET_SHA && deployment.task === task)
              .sort((left, right) => new Date(right.created_at) - new Date(left.created_at));
            if (exactDeployments.length === 0) {
              core.setFailed(`${process.env.APPLICATION} ${process.env.TARGET_SHA} has no ${environment} deployment record`);
              return;
            }
            const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
              ...context.repo,
              deployment_id: exactDeployments[0].id,
              per_page: 100,
            });
            const latestStatus = statuses
              .sort((left, right) => new Date(right.created_at) - new Date(left.created_at))[0];
            if (latestStatus?.state !== 'success') {
              core.setFailed(`Latest ${environment} deployment did not succeed`);
            }
      - name: Write qualification summary
        env:
          APPLICATION: ${{ inputs.application }}
          OPERATION: ${{ inputs.operation }}
          REASON: ${{ inputs.reason }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_URL: ${{ steps.release.outputs.release-url }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          {
            echo "## Production qualification"
            echo
            echo "- Operation: \`${OPERATION}\`"
            echo "- Application: \`${APPLICATION}\`"
            echo "- Release: [\`${RELEASE_TAG}\`](${RELEASE_URL})"
            echo "- Commit: \`${TARGET_SHA}\`"
            if [ -n "${REASON}" ]; then
              echo "- Reason: ${REASON}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  rollback-prod:
    name: Roll back ${{ inputs.application }} in prod
    needs: qualify-release
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write
    uses: ./.github/workflows/_delivery-deploy-environment.yml
    with:
      application: ${{ inputs.application }}
      environment: prod
      sha: ${{ needs.qualify-release.outputs.sha }}
      operation: ${{ inputs.operation }}
      source: ${{ inputs.release-tag }}
    secrets:
      PROD_AWS_ACCOUNT_ID: ${{ secrets.PROD_AWS_ACCOUNT_ID }}
      SLACK_DEPLOY_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
