name: 'Tracker: reconcile issue states'
run-name: "Reconcile issue states (${{ github.event_name == 'issues' && format('issue #{0} {1}', github.event.issue.number, github.event.action) || github.event_name }})"

on:
  # Title and body edits change neither triage nor containers, so `edited`
  # starts no run.
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  # The hourly sweep catches project field and hierarchy changes, which have
  # no Actions trigger, and any issue event whose run was skipped.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview metadata and container completion without writes
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: "${{ github.event_name == 'issues' && format('issue-states-issue-{0}', github.event.issue.number) || 'issue-states-sweep' }}"
  cancel-in-progress: false

jobs:
  reconcile-issues:
    name: Reconcile issue project states
    if: github.repository == 'samlevin/mcc-stats-suite' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out default-branch scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: Triage issues and close finished containers
        env:
          MCC_PROJECT_TOKEN: ${{ secrets.MCC_PROJECT_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        # An issue event reconciles only that issue and its hierarchy; a
        # scheduled or manual run sweeps the project.
        run: |
          scope=()
          if [ -n "$ISSUE_NUMBER" ]; then scope=(--issue "$ISSUE_NUMBER"); fi
          node scripts/issue-triage.mjs "${scope[@]}"
          node scripts/issue-containers.mjs "${scope[@]}"
