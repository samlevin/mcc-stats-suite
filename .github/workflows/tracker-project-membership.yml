name: 'Tracker: add issues to the project'
run-name: "${{ github.event_name == 'issues' && format('Add issue #{0} to MCC delivery', github.event.issue.number) || format('Add missing issues to MCC delivery ({0})', github.event_name) }}"

on:
  issues:
    types: [opened]
  # GitHub sometimes creates no run for an `opened` event, which never fires
  # again for that issue, so the hourly tracker-issue-states.yml sweep adds
  # every open issue still missing before it triages. A manual run here sweeps
  # project membership alone.
  workflow_dispatch:
    inputs:
      dry_run:
        description: List open issues missing from MCC delivery without adding them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: "${{ github.event_name == 'issues' && format('project-membership-issue-{0}', github.event.issue.number) || 'project-membership-sweep' }}"
  cancel-in-progress: false

jobs:
  add-to-project:
    name: Add the new issue to MCC delivery
    if: github.event_name == 'issues' && github.repository == 'samlevin/mcc-stats-suite'
    uses: agenticool/agenticool/.github/workflows/_tracker-project-membership.yml@tracker-v0.1.0
    with:
      token_env: 'MCC_PROJECT_TOKEN'
      tracker_version: '0.1.0'
      issue: ${{ github.event.issue.number }}
    secrets:
      project_token: ${{ secrets.MCC_PROJECT_TOKEN }}

  add-missing-issues:
    name: Add missing open issues to MCC delivery
    if: github.event_name != 'issues' && github.repository == 'samlevin/mcc-stats-suite' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: agenticool/agenticool/.github/workflows/_tracker-project-membership.yml@tracker-v0.1.0
    with:
      token_env: 'MCC_PROJECT_TOKEN'
      tracker_version: '0.1.0'
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      project_token: ${{ secrets.MCC_PROJECT_TOKEN }}
