name: 'Tracker: add issues to the project'
run-name: "${{ github.event_name == 'issues' && format('Add issue #{0} to MCC delivery', github.event.issue.number) || format('Add missing issues to MCC delivery ({0})', github.event_name) }}"

on:
  issues:
    types: [opened]
  # GitHub sometimes creates no run for an `opened` event, which never fires
  # again for that issue, so a sweep adds every open issue still missing. It
  # runs five minutes before each tracker-issue-states.yml run, which then
  # triages the issues it added.
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List open issues missing from MCC delivery without adding them
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: "${{ github.event_name == 'issues' && format('project-membership-issue-{0}', github.event.issue.number) || 'project-membership-sweep' }}"
  cancel-in-progress: false

jobs:
  add-to-project:
    name: Add the new issue to MCC delivery
    if: github.event_name == 'issues' && github.repository == 'samlevin/mcc-stats-suite'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Execute trusted default-branch code.
      - name: Check out default-branch scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: Add the issue to MCC delivery
        env:
          MCC_PROJECT_TOKEN: ${{ secrets.MCC_PROJECT_TOKEN }}
          CONTENT_TYPE: 'issue'
          CONTENT_NUMBER: ${{ github.event.issue.number }}
          DRY_RUN: 'false'
        run: node scripts/issue-project-membership.mjs

  add-missing-issues:
    name: Add missing open issues to MCC delivery
    if: github.event_name != 'issues' && github.repository == 'samlevin/mcc-stats-suite' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Execute trusted default-branch code.
      - name: Check out default-branch scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: Add missing open issues to MCC delivery
        env:
          MCC_PROJECT_TOKEN: ${{ secrets.MCC_PROJECT_TOKEN }}
          SWEEP: 'true'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/issue-project-membership.mjs
