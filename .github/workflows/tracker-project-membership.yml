name: 'Tracker: add issues to the project'
run-name: 'Add issue #${{ github.event.issue.number }} to MCC delivery'

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: project-membership-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  add-to-project:
    name: Add the new issue to MCC delivery
    if: github.repository == 'samlevin/mcc-stats-suite'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Execute trusted default-branch code.
      - name: Check out default-branch scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
      - name: Add the issue to MCC delivery
        env:
          MCC_PROJECT_TOKEN: ${{ secrets.MCC_PROJECT_TOKEN }}
          CONTENT_TYPE: 'issue'
          CONTENT_NUMBER: ${{ github.event.issue.number }}
          DRY_RUN: 'false'
        run: node scripts/issue-project-membership.mjs
