name: deliver-aws-application-reusable

on:
  workflow_call:
    inputs:
      application:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: write
  issues: write
  pull-requests: read
  packages: read
  id-token: write

jobs:
  dev:
    uses: ./.github/workflows/_deploy-aws-application.yml
    with:
      application: ${{ inputs.application }}
      environment: dev
      sha: ${{ inputs.sha }}
      operation: continuous-delivery
      source: main

  approval-prompt:
    needs: dev
    if: needs.dev.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Prompt for production approval
        uses: actions/github-script@v9
        env:
          APPLICATION: ${{ inputs.application }}
          TARGET_SHA: ${{ inputs.sha }}
        with:
          script: |
            const application = process.env.APPLICATION;
            const sha = process.env.TARGET_SHA;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = `<!-- production-approval:${application} -->`;
            const body = `${marker}\n@${context.repo.owner}, approve production for \`${application}\` at \`${sha.slice(0, 7)}\`.\n\n[Review deployments](${runUrl}) in this run after completing the dev smoke test. Select the pending production deployment to approve or reject it.`;
            await core.summary.addRaw(body).write();
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              ...context.repo,
              commit_sha: sha,
            });
            const pull = pulls.find((pull) => pull.merged_at && pull.merge_commit_sha === sha && pull.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}`);
            if (!pull) {
              core.info('No merged pull request for this commit; skipping approval comment.');
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: pull.number,
            });
            const comment = comments.find((comment) => comment.user.login === 'github-actions[bot]' && comment.body.startsWith(marker));
            if (comment) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: comment.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: pull.number, body });
            }

  prod:
    name: 'Approve production: ${{ inputs.application }}'
    needs: dev
    if: needs.dev.result == 'success'
    uses: ./.github/workflows/_deploy-aws-application.yml
    with:
      application: ${{ inputs.application }}
      environment: prod
      sha: ${{ inputs.sha }}
      operation: continuous-delivery
      source: main
