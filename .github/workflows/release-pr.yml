name: 'Release: release PR'

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Release Please writes with the GitHub App token below. Pull requests opened
# with GITHUB_TOKEN would not start the checks the main ruleset requires.
permissions:
  contents: read

jobs:
  update-release-pr:
    name: Update release PR and publish releases
    runs-on: ubuntu-latest
    outputs:
      applications: ${{ steps.selection.outputs.applications }}
    steps:
      - name: Create release token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Select released applications
        id: selection
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        with:
          script: |
            const outputs = JSON.parse(process.env.RELEASE_OUTPUTS);
            const paths = JSON.parse(outputs.paths_released || '[]');
            if (!Array.isArray(paths) || new Set(paths).size !== paths.length) {
              throw new Error('Invalid released paths');
            }
            const allowed = ['admin', 'data-pipeline', 'match-to-csv', 'ocr-quality', 'player'];
            const applications = paths.filter((path) => path.startsWith('applications/')).map((path) => {
              const application = path.slice('applications/'.length);
              const tag = outputs[`${path}--tag_name`];
              const sha = outputs[`${path}--sha`];
              if (!allowed.includes(application) ||
                  !new RegExp(`^${application}-v(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)$`).test(tag) ||
                  !/^[0-9a-f]{40}$/.test(sha)) {
                throw new Error(`Invalid application release: ${path}`);
              }
              return { application, tag, sha };
            });
            core.setOutput('applications', JSON.stringify(applications));

  # Deploys run in their own workflow, so a run of it exists only when this push
  # published an application release. GitHub starts a workflow_dispatch run
  # even when GITHUB_TOKEN sends it.
  start-application-deploys:
    name: Start deploys for released applications
    needs: update-release-pr
    if: github.ref == 'refs/heads/main' && needs.update-release-pr.outputs.applications != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the application deploy workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASES: ${{ needs.update-release-pr.outputs.applications }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'delivery-deploy-releases.yml',
              ref: 'main',
              inputs: { releases: process.env.RELEASES },
            });
