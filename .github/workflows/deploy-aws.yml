name: deploy-aws-application

on:
  workflow_dispatch:
    inputs:
      application:
        description: Logical application workspace
        required: true
        type: choice
        options:
          - match-to-csv
      environment:
        description: AWS environment
        required: true
        type: choice
        options: [dev, prod]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      MCC_DEV_ACCOUNT_ID: ${{ inputs.environment == 'dev' && vars.AWS_ACCOUNT_ID || '' }}
      MCC_PROD_ACCOUNT_ID: ${{ inputs.environment == 'prod' && vars.AWS_ACCOUNT_ID || '' }}
      MCC_EMAIL_DOMAIN: ${{ vars.MCC_EMAIL_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
      - run: npm ci
      - run: npm test --workspace "@mcc/${{ inputs.application }}"
      - name: Require main for production
        if: inputs.environment == 'prod'
        run: test "${GITHUB_REF}" = "refs/heads/main"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CDK_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify target account
        run: |
          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          test "${ACTUAL_ACCOUNT}" = "${{ vars.AWS_ACCOUNT_ID }}"
      - name: Synthesize
        run: |
          INSTANCE_ARGS=()
          if [ "${{ inputs.environment }}" = "dev" ]; then
            INSTANCE_ARGS+=(--instance shared)
          fi
          npm run app:synth -- \
            "${{ inputs.application }}" \
            --environment "${{ inputs.environment }}" \
            "${INSTANCE_ARGS[@]}"
      - name: Deploy
        run: |
          INSTANCE_ARGS=()
          if [ "${{ inputs.environment }}" = "dev" ]; then
            INSTANCE_ARGS+=(--instance shared)
          fi
          if [ "${{ inputs.application }}" = "match-to-csv" ]; then
            test -n "${MCC_EMAIL_DOMAIN}"
          fi
          npm run app:deploy -- \
            "${{ inputs.application }}" \
            --environment "${{ inputs.environment }}" \
            "${INSTANCE_ARGS[@]}" \
            --require-approval never
