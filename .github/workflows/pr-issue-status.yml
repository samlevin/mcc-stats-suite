name: Move closing issues to review

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-issue-status-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'samlevin/mcc-stats-suite' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Execute trusted default-branch code for fork PRs too.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Move claimed closing issues to In review
        env:
          MCC_PROJECT_TOKEN: ${{ secrets.MCC_PROJECT_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          DRY_RUN: 'false'
        run: node scripts/issue-pr-status.mjs
