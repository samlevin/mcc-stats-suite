name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Release Please writes with the GitHub App token below. Pull requests opened
# with GITHUB_TOKEN would not start the checks the main ruleset requires.
permissions:
  contents: read

jobs:
  release-please:
    name: Update release pull request
    runs-on: ubuntu-latest
    steps:
      - name: Create release token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
