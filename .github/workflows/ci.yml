name: ci

on:
  pull_request:
  push:
    branches: [main]

# A unique push group never supersedes main validation or deployments.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # CDK bundles the ARM64 match-to-csv Lambda in Docker; use a native runner
    # so Bun and the native dependencies do not execute under QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    env:
      MCC_BUILD_ENVIRONMENT: dev
    outputs:
      applications: ${{ steps.affected.outputs.applications }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks from changed files
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BASE"
            HEAD="$PUSH_HEAD"
            if [[ "$BASE" =~ ^0+$ ]]; then
              BASE="$(git rev-parse "$HEAD^" 2>/dev/null || true)"
            fi
          fi
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] &&
             git show "$BASE:scripts/ci-scope.mjs" > "$RUNNER_TEMP/ci-scope.mjs"; then
            node "$RUNNER_TEMP/ci-scope.mjs" "$BASE" "$HEAD" "$EVENT" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "repository=true" >> "$GITHUB_OUTPUT"
            echo "No baseline classifier; running all checks."
          fi
          echo "base=${BASE:-$HEAD}" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: opentofu/setup-opentofu@v1
        if: steps.scope.outputs.full == 'true'
        with:
          tofu_version: '1.12.1'
      - run: npm ci
      - name: Start trusted dev Turbo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.scope.outputs.full == 'true'
        uses: ./.github/actions/turbo-s3-cache
        with:
          environment: dev
          account-id: ${{ vars.DEV_AWS_ACCOUNT_ID }}
          region: ${{ vars.DEV_AWS_REGION || 'us-east-1' }}
      - name: Run independent checks concurrently
        env:
          CI_BASE: ${{ steps.scope.outputs.base }}
          CI_HEAD: ${{ steps.scope.outputs.head }}
          CI_EVENT: ${{ github.event_name }}
          CI_FULL: ${{ steps.scope.outputs.full }}
          CI_REPOSITORY: ${{ steps.scope.outputs.repository }}
        run: node scripts/ci-checks.mjs
      - name: Find affected deployable applications
        id: affected
        if: github.event_name == 'push' && steps.scope.outputs.full == 'true'
        env:
          TURBO_SCM_BASE: ${{ github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: |
          if [[ "${TURBO_SCM_BASE}" =~ ^0+$ ]]; then
            TURBO_SCM_BASE="${TURBO_SCM_HEAD}^"
            export TURBO_SCM_BASE
          fi
          APPLICATIONS="$(npx turbo run cdk:deploy --affected --dry=json | jq -c '
            [.tasks[]
              | select(.task == "cdk:deploy" and .command != "<NONEXISTENT>")
              | .package
              | select(startswith("@mcc/"))
              | sub("^@mcc/"; "")]
            | unique')"
          echo "applications=${APPLICATIONS}" >> "${GITHUB_OUTPUT}"
      - name: Save affected applications for dev deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APPLICATIONS: ${{ steps.affected.outputs.applications || '[]' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/deploy-selection"
          printf '%s\n' "${APPLICATIONS}" > "${RUNNER_TEMP}/deploy-selection/applications.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: deploy-applications-${{ github.run_id }}
          path: ${{ runner.temp }}/deploy-selection/applications.json
          retention-days: 1
