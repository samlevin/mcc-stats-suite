name: ci

on:
  pull_request:
  push:
    branches: [main]

# A unique push group never supersedes main validation or deployments.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      repository: ${{ steps.scope.outputs.repository }}
      infrastructure: ${{ steps.scope.outputs.infrastructure }}
      check: ${{ steps.scope.outputs.check }}
      mode: ${{ steps.scope.outputs.mode }}
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
    steps:
      - name: Classify changed files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: scope
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { pathToFileURL } = require('url');
            const event = context.eventName;
            let base = event === 'pull_request'
              ? context.payload.pull_request.base.sha
              : context.payload.before;
            const head = event === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;
            const all = { full: true, repository: true, infrastructure: true, check: true, mode: 'all' };
            let scopes = all;
            if (/^0+$/.test(base)) {
              core.warning('Push has no usable base commit; running every gate.');
              base = head;
            } else {
              try {
                // One comparison serves pushes and PRs. Its merge base is the
                // Turbo affected base, so later jobs never re-diff.
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `${base}...${head}`,
                });
                const files = comparison.data.files || [];
                if (files.length >= 300)
                  throw new Error('comparison reached the file list limit');
                const paths = files.flatMap((file) =>
                  file.previous_filename
                    ? [file.previous_filename, file.filename]
                    : [file.filename],
                );
                const baseline = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: 'scripts/ci-scope.mjs',
                  ref: base,
                });
                const classifierPath = path.join(process.env.RUNNER_TEMP, 'ci-scope-baseline.mjs');
                fs.writeFileSync(classifierPath, Buffer.from(baseline.data.content, 'base64'));
                const { selectScopes } = await import(pathToFileURL(classifierPath));
                if (typeof selectScopes !== 'function')
                  throw new Error('Baseline classifier has no supported entry point.');
                scopes = { ...all, ...selectScopes(paths, event) };
                if (!['affected', 'all'].includes(scopes.mode)) scopes.mode = 'all';
                base = comparison.data.merge_base_commit.sha;
              } catch (error) {
                core.warning(`Could not classify the commit comparison; running every gate: ${error.message}`);
                scopes = all;
                base = head;
              }
            }
            for (const [name, value] of Object.entries({ ...scopes, base, head }))
              core.setOutput(name, value);

  infrastructure:
    name: Validate infrastructure
    needs: scope
    if: needs.scope.outputs.infrastructure != 'false'
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read pinned OpenTofu version
        id: tofu-version
        run: |
          version="$(./scripts/tofu-checks.sh --pinned-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: ${{ steps.tofu-version.outputs.version }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.tofu-plugin-cache
          key: tofu-provider-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infrastructure/**/.terraform.lock.hcl') }}
          restore-keys: tofu-provider-${{ runner.os }}-${{ runner.arch }}-
      - name: Check OpenTofu roots
        run: ./scripts/tofu-checks.sh

  application-checks:
    name: Validate applications
    needs: scope
    if: needs.scope.outputs.check != 'false'
    # Static checks do no Docker work. They stay on the ARM64 runner pool so
    # tests run on the architecture Lambda uses.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      MCC_BUILD_ENVIRONMENT: dev
    outputs:
      applications: ${{ steps.affected.outputs.applications }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@samlevin'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Start trusted dev Turbo cache
        # The cache belongs to the upstream accounts; forks run uncached.
        if: github.repository == 'samlevin/mcc-stats-suite' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.scope.outputs.full == 'true'
        uses: ./.github/actions/turbo-s3-cache
        with:
          environment: dev
          account-id: ${{ vars.DEV_AWS_ACCOUNT_ID }}
          region: ${{ vars.DEV_AWS_REGION || 'us-east-1' }}
      - name: Run independent checks concurrently
        env:
          CI_BASE: ${{ needs.scope.outputs.base }}
          CI_HEAD: ${{ needs.scope.outputs.head }}
          CI_FULL: ${{ needs.scope.outputs.full }}
          CI_REPOSITORY: ${{ needs.scope.outputs.repository }}
          CI_MODE: ${{ needs.scope.outputs.mode }}
          CI_JOB: static
        run: node scripts/ci-checks.mjs
      - name: Find affected deployable applications
        id: affected
        if: github.event_name == 'push' && needs.scope.outputs.full == 'true'
        env:
          TURBO_SCM_BASE: ${{ github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: |
          if [[ "${TURBO_SCM_BASE}" =~ ^0+$ ]]; then
            TURBO_SCM_BASE="${TURBO_SCM_HEAD}^"
            export TURBO_SCM_BASE
          fi
          APPLICATIONS="$(npx turbo run cdk:deploy --affected --dry=json | jq -c '
            [.tasks[]
              | select(.task == "cdk:deploy" and .command != "<NONEXISTENT>")
              | .package
              | select(startswith("@samlevin/"))
              | sub("^@samlevin/"; "")]
            | unique')"
          echo "applications=${APPLICATIONS}" >> "${GITHUB_OUTPUT}"
  application-bundles:
    needs: scope
    if: needs.scope.outputs.check != 'false' && needs.scope.outputs.full == 'true'
    # CDK bundles the ARM64 match-to-csv Lambda in Docker; use a native runner
    # so Bun and the native dependencies do not execute under QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      packages: read
    env:
      MCC_BUILD_ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Start pulling the CDK bundling image
        # Runs in the background so the pull overlaps Node setup and npm ci.
        # The digest comes from the stack's pin, so CI bundles what deploys do.
        run: |
          IMAGE="$(grep -oE 'public\.ecr\.aws/sam/build-nodejs[0-9.]+x@sha256:[0-9a-f]{64}' applications/match-to-csv/cdk/lib/bundling.ts)"
          test -n "${IMAGE}"
          nohup docker pull --platform linux/arm64 "${IMAGE}" > "${RUNNER_TEMP}/image-pull.log" 2>&1 &
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@samlevin'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Start trusted dev Turbo cache
        if: github.repository == 'samlevin/mcc-stats-suite' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/turbo-s3-cache
        with:
          environment: dev
          account-id: ${{ vars.DEV_AWS_ACCOUNT_ID }}
          region: ${{ vars.DEV_AWS_REGION || 'us-east-1' }}
      - name: Synthesize stacks and verify native bundles
        env:
          CI_BASE: ${{ needs.scope.outputs.base }}
          CI_HEAD: ${{ needs.scope.outputs.head }}
          CI_FULL: ${{ needs.scope.outputs.full }}
          CI_REPOSITORY: ${{ needs.scope.outputs.repository }}
          CI_MODE: ${{ needs.scope.outputs.mode }}
          CI_JOB: bundle
        run: node scripts/ci-checks.mjs
  check:
    needs: [scope, infrastructure, application-checks, application-bundles]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      applications: ${{ needs.application-checks.outputs.applications }}
    steps:
      - name: Require every selected gate
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_INFRASTRUCTURE: ${{ needs.scope.outputs.infrastructure }}
          SCOPE_APPLICATIONS: ${{ needs.scope.outputs.check }}
          INFRASTRUCTURE_RESULT: ${{ needs.infrastructure.result }}
          SCOPE_FULL: ${{ needs.scope.outputs.full }}
          APPLICATIONS_RESULT: ${{ needs.application-checks.result }}
          BUNDLES_RESULT: ${{ needs.application-bundles.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [[ "$SCOPE_INFRASTRUCTURE" != false ]]; then
            test "$INFRASTRUCTURE_RESULT" = success
          fi
          if [[ "$SCOPE_APPLICATIONS" != false ]]; then
            test "$APPLICATIONS_RESULT" = success
            if [[ "$SCOPE_FULL" = true ]]; then
              test "$BUNDLES_RESULT" = success
            fi
          fi

  select-deployment:
    name: Select applications to deploy
    needs: check
    # The implicit success() fails when either gate was skipped upstream of
    # check, so require check's own result instead.
    if: ${{ !cancelled() && needs.check.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Save application selection
        env:
          APPLICATIONS: ${{ needs.check.outputs.applications || '[]' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/deploy-selection"
          printf '%s\n' "${APPLICATIONS}" > "${RUNNER_TEMP}/deploy-selection/applications.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-applications-${{ github.run_id }}
          path: ${{ runner.temp }}/deploy-selection/applications.json
          retention-days: 1
