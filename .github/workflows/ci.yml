name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    # CDK bundles the ARM64 match-to-csv Lambda in Docker; use a native runner
    # so Bun and the native dependencies do not execute under QEMU.
    runs-on: ubuntu-24.04-arm
    outputs:
      applications: ${{ steps.affected.outputs.applications }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks from changed files
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT" == "pull_request" ]]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BASE"
            HEAD="$PUSH_HEAD"
            if [[ "$BASE" =~ ^0+$ ]]; then
              BASE="$(git rev-parse "$HEAD^" 2>/dev/null || true)"
            fi
          fi
          if [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] &&
             git show "$BASE:scripts/ci-scope.mjs" > "$RUNNER_TEMP/ci-scope.mjs"; then
            node "$RUNNER_TEMP/ci-scope.mjs" "$BASE" "$HEAD" "$EVENT" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "repository=true" >> "$GITHUB_OUTPUT"
            echo "No baseline classifier; running all checks."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: opentofu/setup-opentofu@v1
        if: steps.scope.outputs.full == 'true'
        with:
          tofu_version: '1.12.1'
      - run: npm ci
      - name: Check formatting, lint, types, tests, and builds
        if: steps.scope.outputs.full == 'true'
        run: npm run check
      - name: Check documentation and repository formatting
        if: steps.scope.outputs.full != 'true'
        run: npm run format:check
      - name: Check repository automation
        if: steps.scope.outputs.full != 'true' && steps.scope.outputs.repository == 'true'
        run: |
          npx eslint scripts/ci-scope.mjs scripts/issue-*.mjs --max-warnings 0
          node --test scripts/issue-*.test.mjs
      - if: steps.scope.outputs.full == 'true'
        run: npm run cdk:synth --workspaces --if-present -- -c environment=dev -c ephemeral=ci
      - if: steps.scope.outputs.full == 'true'
        run: npm run verify:bundle --workspace @mcc/match-to-csv
      - if: steps.scope.outputs.full == 'true'
        run: npm run tofu:fmt:check
      - name: Find affected deployable applications
        id: affected
        if: github.event_name == 'push' && steps.scope.outputs.full == 'true'
        env:
          TURBO_SCM_BASE: ${{ github.event.before }}
          TURBO_SCM_HEAD: ${{ github.sha }}
        run: |
          if [[ "${TURBO_SCM_BASE}" =~ ^0+$ ]]; then
            TURBO_SCM_BASE="${TURBO_SCM_HEAD}^"
            export TURBO_SCM_BASE
          fi
          APPLICATIONS="$(npx turbo run cdk:deploy --affected --dry=json | jq -c '
            [.tasks[]
              | select(.task == "cdk:deploy" and .command != "<NONEXISTENT>")
              | .package
              | select(startswith("@mcc/"))
              | sub("^@mcc/"; "")]
            | unique')"
          echo "applications=${APPLICATIONS}" >> "${GITHUB_OUTPUT}"

  deploy-dev:
    if: github.event_name == 'push' && needs.check.outputs.applications != '' && needs.check.outputs.applications != '[]'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        application: ${{ fromJSON(needs.check.outputs.applications) }}
    permissions:
      contents: read
      deployments: write
      id-token: write
    uses: ./.github/workflows/_deploy-aws-application.yml
    with:
      application: ${{ matrix.application }}
      environment: dev
      sha: ${{ github.sha }}
      operation: continuous-delivery
      source: main
