name: 'CI: checks'

on:
  pull_request:
  push:
    branches: [main]

# A unique push group never supersedes main validation.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      repository: ${{ steps.scope.outputs.repository }}
      infrastructure: ${{ steps.scope.outputs.infrastructure }}
      check: ${{ steps.scope.outputs.check }}
      mode: ${{ steps.scope.outputs.mode }}
      base: ${{ steps.scope.outputs.base }}
      head: ${{ steps.scope.outputs.head }}
    steps:
      - name: Classify changed files
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: scope
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { pathToFileURL } = require('url');
            const event = context.eventName;
            let base = event === 'pull_request'
              ? context.payload.pull_request.base.sha
              : context.payload.before;
            const head = event === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;
            const all = { full: true, repository: true, infrastructure: true, check: true, mode: 'all' };
            let scopes = all;
            if (/^0+$/.test(base)) {
              core.warning('Push has no usable base commit; running every gate.');
              base = head;
            } else {
              try {
                // One comparison serves pushes and PRs. Its merge base is the
                // Turbo affected base, so later jobs never re-diff.
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `${base}...${head}`,
                });
                const files = comparison.data.files || [];
                if (files.length >= 300)
                  throw new Error('comparison reached the file list limit');
                const paths = files.flatMap((file) =>
                  file.previous_filename
                    ? [file.previous_filename, file.filename]
                    : [file.filename],
                );
                const baseline = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: 'scripts/ci-scope.mjs',
                  ref: base,
                });
                const classifierPath = path.join(process.env.RUNNER_TEMP, 'ci-scope-baseline.mjs');
                fs.writeFileSync(classifierPath, Buffer.from(baseline.data.content, 'base64'));
                const { selectScopes } = await import(pathToFileURL(classifierPath));
                if (typeof selectScopes !== 'function')
                  throw new Error('Baseline classifier has no supported entry point.');
                scopes = { ...all, ...selectScopes(paths, event) };
                if (!['affected', 'all'].includes(scopes.mode)) scopes.mode = 'all';
                base = comparison.data.merge_base_commit.sha;
              } catch (error) {
                core.warning(`Could not classify the commit comparison; running every gate: ${error.message}`);
                scopes = all;
                base = head;
              }
            }
            for (const [name, value] of Object.entries({ ...scopes, base, head }))
              core.setOutput(name, value);

  check-infrastructure:
    name: Check OpenTofu roots and modules
    needs: detect-changes
    if: needs.detect-changes.outputs.infrastructure != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read pinned OpenTofu version
        id: tofu-version
        run: |
          version="$(./scripts/tofu-checks.sh --pinned-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: ${{ steps.tofu-version.outputs.version }}
      - name: Restore OpenTofu provider cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.tofu-plugin-cache
          key: tofu-provider-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('infrastructure/**/.terraform.lock.hcl') }}
          restore-keys: tofu-provider-${{ runner.os }}-${{ runner.arch }}-
      - name: Check OpenTofu formatting, roots, and module tests
        run: ./scripts/tofu-checks.sh

  check-workspaces:
    name: Build and test affected workspaces
    needs: detect-changes
    if: needs.detect-changes.outputs.check != 'false'
    # Static checks do no Docker work. They stay on the ARM64 runner pool so
    # tests run on the architecture Lambda uses.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MCC_BUILD_ENVIRONMENT: dev
      # `build` already type-checks every CDK source, so synthesis only transpiles.
      TS_NODE_TRANSPILE_ONLY: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start trusted dev Turbo cache
        # Opt-in per repository; a repository without MCC_TURBO_CACHE runs uncached.
        # main writes the cache. Same-repo pull requests only read it; fork pull
        # requests get no OIDC token, so they skip this step and run uncached.
        if: vars.MCC_TURBO_CACHE == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && needs.detect-changes.outputs.full == 'true'
        # A pull request whose cache start fails runs uncached; main still fails loudly.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/turbo-s3-cache
        with:
          environment: dev
          account-id: ${{ secrets.DEV_AWS_ACCOUNT_ID }}
          region: ${{ vars.DEV_AWS_REGION || 'us-east-1' }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run format, lint, release, agent, build, and test checks
        env:
          CI_BASE: ${{ needs.detect-changes.outputs.base }}
          CI_HEAD: ${{ needs.detect-changes.outputs.head }}
          CI_FULL: ${{ needs.detect-changes.outputs.full }}
          CI_REPOSITORY: ${{ needs.detect-changes.outputs.repository }}
          CI_MODE: ${{ needs.detect-changes.outputs.mode }}
          CI_JOB: static
        run: node scripts/ci-checks.mjs

  check-scripts:
    name: Test repository build scripts
    needs: detect-changes
    if: needs.detect-changes.outputs.check != 'false' && needs.detect-changes.outputs.full == 'true'
    # A separate runner keeps the root script tests from competing with the
    # workspace tests for CPUs.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MCC_BUILD_ENVIRONMENT: dev
      # The local bootstrap tests synthesize every app through ts-node.
      TS_NODE_TRANSPILE_ONLY: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start trusted dev Turbo cache
        if: vars.MCC_TURBO_CACHE == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        # A pull request whose cache start fails runs uncached; main still fails loudly.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/turbo-s3-cache
        with:
          environment: dev
          account-id: ${{ secrets.DEV_AWS_ACCOUNT_ID }}
          region: ${{ vars.DEV_AWS_REGION || 'us-east-1' }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run repository build script tests
        env:
          CI_BASE: ${{ needs.detect-changes.outputs.base }}
          CI_HEAD: ${{ needs.detect-changes.outputs.head }}
          CI_FULL: ${{ needs.detect-changes.outputs.full }}
          CI_REPOSITORY: ${{ needs.detect-changes.outputs.repository }}
          CI_MODE: ${{ needs.detect-changes.outputs.mode }}
          CI_JOB: scripts
        run: node scripts/ci-checks.mjs

  check-bundles:
    name: Synthesize CDK stacks and verify Lambda bundles
    needs: detect-changes
    if: needs.detect-changes.outputs.check != 'false' && needs.detect-changes.outputs.full == 'true'
    # CDK bundles the ARM64 match-to-csv Lambda in Docker; use a native runner
    # so Bun and the native dependencies do not execute under QEMU.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MCC_BUILD_ENVIRONMENT: dev
      # `build` already type-checks every CDK source, so synthesis only transpiles.
      TS_NODE_TRANSPILE_ONLY: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Switch Docker to the containerd image store
        # Only with this store can the default builder, which CDK uses, read
        # and write the GitHub Actions build cache.
        run: |
          CONFIG="$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')"
          sudo mkdir -p /etc/docker
          jq '.features["containerd-snapshotter"] = true' <<< "${CONFIG}" | sudo tee /etc/docker/daemon.json > /dev/null
          sudo systemctl restart docker
      - name: Start pulling the CDK bundling image
        id: bundling-image
        # Runs in the background so the pull overlaps Node setup and npm ci.
        # The digest comes from the stack's pin, so CI bundles what deploys do.
        run: |
          IMAGE="$(grep -oE 'public\.ecr\.aws/sam/build-nodejs[0-9.]+x@sha256:[0-9a-f]{64}' applications/match-to-csv/cdk/lib/bundling.ts)"
          test -n "${IMAGE}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          nohup docker pull --platform linux/arm64 "${IMAGE}" > "${RUNNER_TEMP}/image-pull.log" 2>&1 &
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Locate the CDK bundling Dockerfile and esbuild version
        id: bundling-build
        working-directory: applications/match-to-csv/cdk
        env:
          IMAGE: ${{ steps.bundling-image.outputs.image }}
        run: |
          CONTEXT="$(node -p "path.join(path.dirname(require.resolve('aws-cdk-lib/package.json')), 'aws-lambda-nodejs/lib/docker')")"
          ESBUILD="$(node -p "require('esbuild/package.json').version")"
          test -f "${CONTEXT}/Dockerfile"
          {
            echo "context=${CONTEXT}"
            echo "esbuild=${ESBUILD}"
            echo "scope=cdk-bundling-${IMAGE##*sha256:}-esbuild-${ESBUILD}"
          } >> "${GITHUB_OUTPUT}"
      - name: Build the CDK bundling image from the Actions cache
        # Same Dockerfile, base image, build arguments, and platform as the
        # NodejsFunction build, so CDK's own docker build reuses every layer
        # and still produces the image deploys use.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: ${{ steps.bundling-build.outputs.context }}
          platforms: linux/arm64
          build-args: |
            IMAGE=${{ steps.bundling-image.outputs.image }}
            ESBUILD_VERSION=${{ steps.bundling-build.outputs.esbuild }}
          load: true
          provenance: false
          tags: mcc-cdk-bundling
          cache-from: type=gha,scope=${{ steps.bundling-build.outputs.scope }}
          cache-to: type=gha,scope=${{ steps.bundling-build.outputs.scope }},mode=max,ignore-error=true
      - name: Start trusted dev Turbo cache
        if: vars.MCC_TURBO_CACHE == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        # A pull request whose cache start fails runs uncached; main still fails loudly.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/turbo-s3-cache
        with:
          environment: dev
          account-id: ${{ secrets.DEV_AWS_ACCOUNT_ID }}
          region: ${{ vars.DEV_AWS_REGION || 'us-east-1' }}
          read-only: ${{ github.event_name == 'pull_request' }}
      - name: Synthesize CDK stacks and verify Lambda bundles
        env:
          CI_BASE: ${{ needs.detect-changes.outputs.base }}
          CI_HEAD: ${{ needs.detect-changes.outputs.head }}
          CI_FULL: ${{ needs.detect-changes.outputs.full }}
          CI_REPOSITORY: ${{ needs.detect-changes.outputs.repository }}
          CI_MODE: ${{ needs.detect-changes.outputs.mode }}
          CI_JOB: bundle
        run: node scripts/ci-checks.mjs

  # The main ruleset requires this job's name. Skipped jobs cannot be required,
  # so this job always runs and fails unless every selected check passed.
  require-scoped-checks:
    name: Require every check selected for the changed files
    needs:
      [
        detect-changes,
        check-infrastructure,
        check-workspaces,
        check-scripts,
        check-bundles,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every selected check passed
        env:
          SCOPE_RESULT: ${{ needs.detect-changes.result }}
          SCOPE_INFRASTRUCTURE: ${{ needs.detect-changes.outputs.infrastructure }}
          SCOPE_APPLICATIONS: ${{ needs.detect-changes.outputs.check }}
          INFRASTRUCTURE_RESULT: ${{ needs.check-infrastructure.result }}
          SCOPE_FULL: ${{ needs.detect-changes.outputs.full }}
          APPLICATIONS_RESULT: ${{ needs.check-workspaces.result }}
          SCRIPTS_RESULT: ${{ needs.check-scripts.result }}
          BUNDLES_RESULT: ${{ needs.check-bundles.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [[ "$SCOPE_INFRASTRUCTURE" != false ]]; then
            test "$INFRASTRUCTURE_RESULT" = success
          fi
          if [[ "$SCOPE_APPLICATIONS" != false ]]; then
            test "$APPLICATIONS_RESULT" = success
            if [[ "$SCOPE_FULL" = true ]]; then
              test "$SCRIPTS_RESULT" = success
              test "$BUNDLES_RESULT" = success
            fi
          fi
