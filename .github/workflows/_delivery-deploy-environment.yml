name: 'Delivery: deploy to one environment (reusable)'

on:
  workflow_call:
    inputs:
      application:
        description: Logical application workspace
        required: true
        type: string
      environment:
        description: GitHub and AWS environment
        required: true
        type: string
      sha:
        description: Full commit SHA to deploy
        required: true
        type: string
      operation:
        description: Deployment operation recorded in GitHub
        required: true
        type: string
      source:
        description: Application release tag
        required: true
        type: string
    outputs:
      deployed:
        description: Whether this call deployed and verified the release
        value: ${{ jobs.deploy.outputs.deployed }}
    # Repository secrets reach a called workflow only when the caller passes
    # them. Each caller passes the account of the environment it deploys, and
    # the optional Slack webhook for deploy messages.
    secrets:
      DEV_AWS_ACCOUNT_ID:
        required: false
      PROD_AWS_ACCOUNT_ID:
        required: false
      SLACK_DEPLOY_WEBHOOK_URL:
        required: false

permissions:
  actions: read
  contents: read
  deployments: write
  id-token: write

jobs:
  verify-prod-protection:
    name: Verify prod reviewer protection
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require prod reviewers without administrator bypass
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data } = await github.rest.repos.getEnvironment({
              ...context.repo,
              environment_name: 'prod',
            });
            const reviewers = data.protection_rules?.find((rule) => rule.type === 'required_reviewers');
            if (!reviewers?.reviewers?.length || data.can_admins_bypass !== false) {
              throw new Error('prod requires reviewers and disabled administrator bypass; configure the Environment with separate authorization');
            }
      # A job waiting for approval runs no steps, so this job posts the approval
      # request before the deploy job starts waiting. A missing webhook or a
      # failed post only warns and never blocks the deploy.
      - name: Post the prod approval request to Slack
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SLACK_DEPLOY_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          APPLICATION: ${{ inputs.application }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_TAG: ${{ inputs.source }}
        with:
          script: |
            const { APPLICATION, DEPLOYMENT_ENVIRONMENT, OPERATION, RELEASE_TAG } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const rollback = OPERATION === 'rollback' ? ' (rollback)' : '';
            const text = `${APPLICATION} ${RELEASE_TAG} -> ${DEPLOYMENT_ENVIRONMENT}${rollback}: waiting for approval ${runUrl}`;
            core.info(text);
            const webhook = process.env.SLACK_DEPLOY_WEBHOOK_URL;
            if (!webhook) {
              core.warning('SLACK_DEPLOY_WEBHOOK_URL is not set, so no Slack message was posted');
              return;
            }
            try {
              const response = await fetch(webhook, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  text: text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
                }),
                signal: AbortSignal.timeout(10000),
              });
              if (!response.ok) core.warning(`Slack answered the deploy message with HTTP ${response.status}`);
            } catch (error) {
              core.warning(`Could not post the deploy message to Slack (${error.name})`);
            }

  deploy:
    name: "${{ format('Deploy {0} to {1}{2}', inputs.application, inputs.environment, inputs.environment == 'prod' && ' (waits for approval)' || '') }}"
    needs: verify-prod-protection
    if: ${{ always() && !cancelled() && (inputs.environment == 'dev' || needs.verify-prod-protection.result == 'success') }}
    concurrency:
      group: deploy-${{ inputs.application }}-${{ inputs.environment }}
      queue: max
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' && steps.verify.outcome == 'success' }}
    # match-to-csv's ARM64 Lambda bundling needs a native ARM Docker host.
    runs-on: ${{ inputs.application == 'match-to-csv' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    env:
      MCC_BUILD_ENVIRONMENT: ${{ inputs.environment }}
      AWS_REGION: ${{ inputs.environment == 'prod' && vars.PROD_AWS_REGION || inputs.environment == 'dev' && vars.DEV_AWS_REGION || 'us-east-1' }}
      # The account IDs are repository secrets, so Actions masks them in logs,
      # including inside the role ARN built from them. Keep them out of job
      # outputs and deployment URLs, where a masked value is dropped. Exactly
      # one of these is set.
      MCC_DEV_ACCOUNT_ID: ${{ inputs.environment == 'dev' && secrets.DEV_AWS_ACCOUNT_ID || '' }}
      MCC_PROD_ACCOUNT_ID: ${{ inputs.environment == 'prod' && secrets.PROD_AWS_ACCOUNT_ID || '' }}
    steps:
      - name: Validate deployment request
        env:
          APPLICATION: ${{ inputs.application }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          TARGET_SHA: ${{ inputs.sha }}
          OPERATION: ${{ inputs.operation }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          case "${OPERATION}" in
            release|rollback) ;;
            *) exit 1 ;;
          esac
          case "${APPLICATION}" in
            admin|data-pipeline|match-to-csv|ocr-quality|player) ;;
            *)
              echo "::error::Unsupported application: ${APPLICATION}"
              exit 1
              ;;
          esac
          case "${DEPLOYMENT_ENVIRONMENT}" in
            dev|prod) ;;
            *)
              echo "::error::Unsupported environment: ${DEPLOYMENT_ENVIRONMENT}"
              exit 1
              ;;
          esac
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Deployment SHA must contain 40 lowercase hexadecimal characters"
            exit 1
          fi
          if [[ ! "${MCC_DEV_ACCOUNT_ID}${MCC_PROD_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "::error::The caller must pass the ${DEPLOYMENT_ENVIRONMENT} account ID repository secret, a 12-digit account ID"
            exit 1
          fi
      - name: Check out the requested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
      - name: Verify checked-out revision
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      # The Turbo cache is opt-in per repository; a repository without
      # MCC_TURBO_CACHE builds uncached.
      - name: Check out cache action from the qualified workflow revision
        if: vars.MCC_TURBO_CACHE == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .cache-workflow
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read release metadata
        id: release-metadata
        env:
          APPLICATION: ${{ inputs.application }}
        run: |
          METADATA="$(npm run release:metadata --silent -- --application "${APPLICATION}")"
          echo "metadata=${METADATA}" >> "${GITHUB_OUTPUT}"
      - name: Guard forward release version
        id: version-guard
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          APPLICATION: ${{ inputs.application }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_TAG: ${{ inputs.source }}
          RELEASE_METADATA: ${{ steps.release-metadata.outputs.metadata }}
        with:
          script: |
            const application = process.env.APPLICATION;
            const tag = process.env.RELEASE_TAG;
            const metadata = JSON.parse(process.env.RELEASE_METADATA);
            const version = (value) => {
              if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(value)) {
                throw new Error(`Invalid stable release version: ${value}`);
              }
              return value.split('.').map(BigInt);
            };
            const candidate = metadata.application.version;
            const requested = version(candidate);
            if (metadata.application.name !== `@mcc/${application}` || tag !== `${application}-v${candidate}`) {
              throw new Error('Release tag does not match the checked-out application version');
            }
            if (process.env.OPERATION === 'rollback') {
              core.setOutput('deploy', 'true');
              return;
            }
            const task = `deploy:${application}`;
            const environment = process.env.DEPLOYMENT_ENVIRONMENT;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, environment, task, per_page: 100,
            });
            const exact = deployments.filter((item) => item.environment === environment && item.task === task &&
              item.payload?.application === application).sort((left, right) => right.id - left.id);
            for (const deployment of exact) {
              const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
                ...context.repo, deployment_id: deployment.id, per_page: 100,
              });
              if (statuses.sort((left, right) => right.id - left.id)[0]?.state !== 'success') continue;
              const previous = deployment.payload?.release?.application?.version;
              const deployed = version(previous);
              const difference = requested.findIndex((part, index) => part !== deployed[index]);
              if (difference === -1 || requested[difference] < deployed[difference]) {
                core.setOutput('deploy', 'false');
                await core.summary.addRaw(`Skipped ${tag} in ${environment}: version ${candidate} is not newer than the latest successful deployment (${previous}).`).write();
                return;
              }
              break;
            }
            core.setOutput('deploy', 'true');
      - name: Start environment Turbo cache
        if: steps.version-guard.outputs.deploy == 'true' && (vars.MCC_TURBO_CACHE == 'true')
        uses: ./.cache-workflow/.github/actions/turbo-s3-cache
        with:
          environment: ${{ inputs.environment }}
          account-id: ${{ env.MCC_DEV_ACCOUNT_ID || env.MCC_PROD_ACCOUNT_ID }}
          region: ${{ env.AWS_REGION }}
      - name: Build selected application with dependencies
        if: steps.version-guard.outputs.deploy == 'true'
        env:
          APPLICATION: ${{ inputs.application }}
        run: |
          PACKAGE_NAME="$(node -p 'require(`./applications/${process.env.APPLICATION}/package.json`).name')"
          npx turbo run build --filter="${PACKAGE_NAME}..."
      - name: Test selected application
        if: steps.version-guard.outputs.deploy == 'true'
        run: npm test --workspace "applications/${{ inputs.application }}"
      - name: Assume the CDK deploy role
        if: steps.version-guard.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::${{ env.MCC_DEV_ACCOUNT_ID || env.MCC_PROD_ACCOUNT_ID }}:role/mcc-stats-suite-${{ inputs.environment }}-github-cdk-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify target account
        if: steps.version-guard.outputs.deploy == 'true'
        env:
          EXPECTED_ACCOUNT: ${{ env.MCC_DEV_ACCOUNT_ID || env.MCC_PROD_ACCOUNT_ID }}
        run: |
          ACTUAL_ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          if [ -z "${EXPECTED_ACCOUNT}" ] || [ "${ACTUAL_ACCOUNT}" != "${EXPECTED_ACCOUNT}" ]; then
            echo "::error::AWS credentials target the wrong account"
            exit 1
          fi
      - name: Verify match-to-csv prerequisites
        if: steps.version-guard.outputs.deploy == 'true' && (inputs.application == 'match-to-csv')
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          PARAMETERS="$(aws ssm get-parameters \
            --names \
              /cdk-bootstrap/hnb659fds/version \
              "/mcc/${DEPLOYMENT_ENVIRONMENT}/match-to-csv/raw-email-bucket-name" \
              "/mcc/${DEPLOYMENT_ENVIRONMENT}/match-to-csv/evidence-bucket-name" \
              "/mcc/${DEPLOYMENT_ENVIRONMENT}/match-to-csv/data-key-arn" \
              "/mcc/${DEPLOYMENT_ENVIRONMENT}/match-to-csv/receipt-rule-set-name" \
              "/mcc/${DEPLOYMENT_ENVIRONMENT}/match-to-csv/email-domain" \
              "/mcc/${DEPLOYMENT_ENVIRONMENT}/roster/table-name" \
            --output json)"
          if [ "$(jq '.Parameters | length' <<<"${PARAMETERS}")" != "7" ]; then
            echo "::error::CDK bootstrap, match-to-csv foundation or roster table parameters are missing"
            exit 1
          fi
          parameter() {
            jq -r --arg name "/mcc/${DEPLOYMENT_ENVIRONMENT}/match-to-csv/$1" \
              '.Parameters[] | select(.Name == $name) | .Value' <<<"${PARAMETERS}"
          }
          RULE_SET_NAME="$(parameter receipt-rule-set-name)"
          MCC_EMAIL_DOMAIN="$(parameter email-domain)"
          # The repository is public; keep the domain out of every later log line.
          echo "::add-mask::${MCC_EMAIL_DOMAIN}"
          ACTIVE_RULE_SET="$(aws ses describe-active-receipt-rule-set \
            --query Metadata.Name \
            --output text)"
          if [ "${ACTIVE_RULE_SET}" != "${RULE_SET_NAME}" ]; then
            echo "::error::The foundation receipt rule set ${RULE_SET_NAME} is not the active rule set"
            exit 1
          fi
          IDENTITY_STATUS="$(aws ses get-identity-verification-attributes \
            --identities "${MCC_EMAIL_DOMAIN}" \
            --query 'VerificationAttributes.*.VerificationStatus | [0]' \
            --output text)"
          if [ "${IDENTITY_STATUS}" != "Success" ]; then
            echo "::error::The SES identity the foundation publishes is not verified in the deployment region"
            exit 1
          fi
          if ! dig +short MX "${MCC_EMAIL_DOMAIN}" | \
            grep -Fq "inbound-smtp.${AWS_REGION}.amazonaws.com."; then
            echo "::error::The MX record for the published domain does not target SES inbound receiving in the deployment region"
            exit 1
          fi
          # The alarm email is optional. CloudFormation resolves it from SSM, so
          # the address never reaches the template or these logs.
          ALARM_EMAIL_PARAMETER="/mcc/${DEPLOYMENT_ENVIRONMENT}/match-to-csv/alarm-email"
          ALARM_EMAIL_COUNT="$(aws ssm get-parameters \
            --names "${ALARM_EMAIL_PARAMETER}" \
            --query 'length(Parameters)' \
            --output text)"
          if [ "${ALARM_EMAIL_COUNT}" = "1" ]; then
            echo "MCC_ALARM_EMAIL_PARAMETER=${ALARM_EMAIL_PARAMETER}" >> "${GITHUB_ENV}"
          else
            echo "::notice::${ALARM_EMAIL_PARAMETER} is not set; alarms publish to the stack topic without an email subscription"
          fi
      - name: Synthesize CDK app
        if: steps.version-guard.outputs.deploy == 'true'
        run: |
          npm run app:synth -- \
            "${{ inputs.application }}" \
            --environment "${{ inputs.environment }}"
      - name: Verify native Lambda bundles
        if: steps.version-guard.outputs.deploy == 'true' && (inputs.application == 'match-to-csv')
        run: npm run verify:bundle --workspace applications/match-to-csv
      - name: Show prod CDK diff
        if: steps.version-guard.outputs.deploy == 'true' && (inputs.environment == 'prod')
        run: |
          npm run app:diff -- \
            "${{ inputs.application }}" \
            --environment prod
      - name: Create exact-revision deployment record
        if: steps.version-guard.outputs.deploy == 'true'
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          APPLICATION: ${{ inputs.application }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_OPERATION: ${{ inputs.operation }}
          DEPLOYMENT_SOURCE: ${{ inputs.source }}
          RELEASE_METADATA: ${{ steps.release-metadata.outputs.metadata }}
          TARGET_SHA: ${{ inputs.sha }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const response = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: process.env.TARGET_SHA,
              task: `deploy:${process.env.APPLICATION}`,
              auto_merge: false,
              required_contexts: [],
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              description: `${process.env.DEPLOYMENT_OPERATION} ${process.env.APPLICATION} from ${process.env.DEPLOYMENT_SOURCE}`,
              transient_environment: false,
              production_environment: process.env.DEPLOYMENT_ENVIRONMENT === 'prod',
              payload: {
                application: process.env.APPLICATION,
                operation: process.env.DEPLOYMENT_OPERATION,
                release: JSON.parse(process.env.RELEASE_METADATA),
                source: process.env.DEPLOYMENT_SOURCE,
                releaseTag: process.env.DEPLOYMENT_SOURCE,
                workflowRun: runUrl,
              },
            });
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: response.data.id,
              state: 'in_progress',
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              description: 'CDK deployment is running',
              log_url: runUrl,
              auto_inactive: false,
            });
            return response.data.id;
      - name: Deploy CDK stacks
        if: steps.version-guard.outputs.deploy == 'true'
        id: deploy
        run: |
          npm run app:deploy -- \
            "${{ inputs.application }}" \
            --environment "${{ inputs.environment }}" \
            --require-approval never
      - name: Verify deployed stack
        if: steps.version-guard.outputs.deploy == 'true'
        id: verify
        env:
          APPLICATION: ${{ inputs.application }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          STACK_NAME="${APPLICATION}-${DEPLOYMENT_ENVIRONMENT}"
          STACK_STATUS="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query 'Stacks[0].StackStatus' \
            --output text)"
          case "${STACK_STATUS}" in
            CREATE_COMPLETE|UPDATE_COMPLETE|IMPORT_COMPLETE) ;;
            *)
              echo "::error::${STACK_NAME} has unexpected status ${STACK_STATUS}"
              exit 1
              ;;
          esac

          if [ "${APPLICATION}" = "match-to-csv" ]; then
            FUNCTIONS="$(aws cloudformation list-stack-resources \
              --stack-name "${STACK_NAME}" \
              --query "StackResourceSummaries[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" \
              --output text)"
            if [ -z "${FUNCTIONS}" ] || [ "${FUNCTIONS}" = "None" ]; then
              echo "::error::${STACK_NAME} has no Lambda functions"
              exit 1
            fi
            for FUNCTION_NAME in ${FUNCTIONS}; do
              read -r STATE UPDATE_STATUS <<<"$(aws lambda get-function-configuration \
                --function-name "${FUNCTION_NAME}" \
                --query '[State,LastUpdateStatus]' \
                --output text)"
              if [ "${STATE}" != "Active" ] || [ "${UPDATE_STATUS}" != "Successful" ]; then
                echo "::error::Lambda ${FUNCTION_NAME} is ${STATE}/${UPDATE_STATUS}"
                exit 1
              fi
            done

            STATE_MACHINES="$(aws cloudformation list-stack-resources \
              --stack-name "${STACK_NAME}" \
              --query "StackResourceSummaries[?ResourceType=='AWS::StepFunctions::StateMachine'].PhysicalResourceId" \
              --output text)"
            if [ -z "${STATE_MACHINES}" ] || [ "${STATE_MACHINES}" = "None" ]; then
              echo "::error::${STACK_NAME} has no Step Functions state machines"
              exit 1
            fi
            for STATE_MACHINE_ARN in ${STATE_MACHINES}; do
              test "$(aws stepfunctions describe-state-machine \
                --state-machine-arn "${STATE_MACHINE_ARN}" \
                --query status \
                --output text)" = "ACTIVE"
            done
          fi
      - name: Finish deployment record
        if: ${{ always() && steps.deployment.outputs.result != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.result }}
          DEPLOYMENT_STATE: ${{ steps.deploy.outcome == 'success' && steps.verify.outcome == 'success' && 'success' || 'failure' }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state: process.env.DEPLOYMENT_STATE,
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              description: process.env.DEPLOYMENT_STATE === 'success'
                ? 'CDK deployment and stack verification succeeded'
                : 'CDK deployment or stack verification failed',
              log_url: runUrl,
              auto_inactive: false,
            });
      - name: Write deployment summary
        if: always()
        env:
          APPLICATION: ${{ inputs.application }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYMENT_OPERATION: ${{ inputs.operation }}
          DEPLOYMENT_SOURCE: ${{ inputs.source }}
          RELEASE_METADATA: ${{ steps.release-metadata.outputs.metadata }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          {
            echo "## Deployment"
            echo
            echo "- Application: \`${APPLICATION}\`"
            echo "- Environment: \`${DEPLOYMENT_ENVIRONMENT}\`"
            echo "- Operation: \`${DEPLOYMENT_OPERATION}\`"
            echo "- Source: \`${DEPLOYMENT_SOURCE}\`"
            echo "- Commit: \`${TARGET_SHA}\`"
            echo "- Versions: \`${RELEASE_METADATA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Runs after every deploy outcome, including a rejected approval, where the
  # deploy job never starts. A missing webhook or a failed post only warns.
  notify-result:
    name: Post the ${{ inputs.application }} ${{ inputs.environment }} result to Slack
    needs:
      - verify-prod-protection
      - deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Post the deploy result to Slack
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SLACK_DEPLOY_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOY_WEBHOOK_URL }}
          APPLICATION: ${{ inputs.application }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_TAG: ${{ inputs.source }}
          PROTECTION_RESULT: ${{ needs.verify-prod-protection.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOYED: ${{ needs.deploy.outputs.deployed }}
        with:
          script: |
            const { APPLICATION, DEPLOYMENT_ENVIRONMENT, OPERATION, RELEASE_TAG } = process.env;
            const { PROTECTION_RESULT, DEPLOY_RESULT, DEPLOYED } = process.env;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const describe = async () => {
              if (DEPLOY_RESULT === 'success') {
                return DEPLOYED === 'true'
                  ? 'succeeded'
                  : 'skipped, the version is not newer than the latest successful deployment';
              }
              if (DEPLOY_RESULT === 'cancelled') return 'cancelled';
              if (DEPLOY_RESULT === 'skipped') {
                return PROTECTION_RESULT === 'failure'
                  ? 'failed, Verify prod reviewer protection did not pass'
                  : 'cancelled';
              }
              // A rejected approval fails the deploy job before any step runs,
              // so the job sets no outputs, and the run records the rejection.
              if (DEPLOYMENT_ENVIRONMENT === 'prod' && DEPLOYED === '') {
                try {
                  const { data } = await github.rest.actions.getReviewsForRun({
                    ...context.repo,
                    run_id: context.runId,
                  });
                  if (data.some((review) => review.state === 'rejected' &&
                      review.environments?.some((environment) => environment.name === 'prod'))) {
                    return 'rejected';
                  }
                } catch (error) {
                  core.warning(`Could not read the run's approvals (${error.name}), so the result reads failed`);
                }
              }
              return 'failed';
            };
            const rollback = OPERATION === 'rollback' ? ' (rollback)' : '';
            const text = `${APPLICATION} ${RELEASE_TAG} -> ${DEPLOYMENT_ENVIRONMENT}${rollback}: ${await describe()} ${runUrl}`;
            core.info(text);
            const webhook = process.env.SLACK_DEPLOY_WEBHOOK_URL;
            if (!webhook) {
              core.warning('SLACK_DEPLOY_WEBHOOK_URL is not set, so no Slack message was posted');
              return;
            }
            try {
              const response = await fetch(webhook, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  text: text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'),
                }),
                signal: AbortSignal.timeout(10000),
              });
              if (!response.ok) core.warning(`Slack answered the deploy message with HTTP ${response.status}`);
            } catch (error) {
              core.warning(`Could not post the deploy message to Slack (${error.name})`);
            }
