name: 'Delivery: promote application (reusable)'

on:
  workflow_call:
    inputs:
      application:
        required: true
        type: string
      sha:
        required: true
        type: string
    secrets:
      DEV_AWS_ACCOUNT_ID:
        required: false
      PROD_AWS_ACCOUNT_ID:
        required: false

permissions:
  contents: read
  actions: read
  deployments: write
  id-token: write

jobs:
  deploy-dev:
    name: Deploy to dev
    uses: ./.github/workflows/_delivery-deploy-environment.yml
    with:
      application: ${{ inputs.application }}
      environment: dev
      sha: ${{ inputs.sha }}
      operation: continuous-delivery
      source: main
    secrets:
      DEV_AWS_ACCOUNT_ID: ${{ secrets.DEV_AWS_ACCOUNT_ID }}

  request-prod-approval:
    name: Request prod approval
    needs: deploy-dev
    if: needs.deploy-dev.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Ask prod reviewers to approve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          APPLICATION: ${{ inputs.application }}
          TARGET_SHA: ${{ inputs.sha }}
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getEnvironment({
                ...context.repo,
                environment_name: 'prod',
              });
              const reviewers = data.protection_rules?.find((rule) => rule.type === 'required_reviewers');
              if (!reviewers?.reviewers?.length || data.can_admins_bypass !== false) {
                core.warning('Production protection is invalid; skipping approval prompt.');
                return;
              }
              const mentions = reviewers.reviewers.map(({ type, reviewer }) =>
                type === 'Team' ? `@${context.repo.owner}/${reviewer.slug}` : `@${reviewer.login}`,
              ).join(' ');
              const application = process.env.APPLICATION;
              const sha = process.env.TARGET_SHA;
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const body = `${mentions}, approve production for \`${application}\` at \`${sha.slice(0, 7)}\`.\n\n[Review deployments](${runUrl}) in this run after completing the dev smoke test. Once the production job is waiting, select it to approve or reject it.`;
              try {
                await core.summary.addRaw(body).write();
              } catch (error) {
                core.warning(`Could not write production approval summary: ${error.message}`);
              }
            } catch (error) {
              core.warning(`Could not prepare production approval summary: ${error.message}`);
            }

  deploy-prod:
    name: Deploy to prod
    needs: deploy-dev
    if: needs.deploy-dev.result == 'success'
    uses: ./.github/workflows/_delivery-deploy-environment.yml
    with:
      application: ${{ inputs.application }}
      environment: prod
      sha: ${{ inputs.sha }}
      operation: continuous-delivery
      source: main
    secrets:
      PROD_AWS_ACCOUNT_ID: ${{ secrets.PROD_AWS_ACCOUNT_ID }}
