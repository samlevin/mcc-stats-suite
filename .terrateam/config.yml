engine:
  name: tofu
  version: 1.12.1

destination_branches:
  - main

indexer:
  enabled: true

drift:
  enabled: true
  schedules:
    foundation:
      tag_query: 'foundation'
      schedule: weekly

# Foundation changes are applied from the pull request, dev before prod. Nothing
# applies from main. A root stays locked from its first apply until the pull
# request merges, and Terrateam merges it once every planned root has applied.
lock_policy: strict

automerge:
  enabled: true
  merge_strategy: squash
  retain_pr_title: true

hooks:
  plan:
    post:
      - type: drift_create_issue

access_control:
  enabled: true
  ci_config_update: ['role:admin']
  terrateam_config_update: ['role:admin']
  unlock: ['role:admin']
  policies:
    - tag_query: 'dev'
      plan: ['*']
      apply: ['role:write', 'role:maintain', 'role:admin']
    - tag_query: 'prod'
      plan: ['*']
      apply: ['role:admin']

dirs:
  # Foundation roots also watch this file because it sets their backend and inputs.
  # Bootstrap stays manual; exclusions also block indexer-added module patterns.
  infrastructure/dev/bootstrap:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  infrastructure/prod/bootstrap:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  infrastructure/dev/foundation:
    tags: [aws, dev, foundation]
    when_modified:
      autoapply: false
      file_patterns:
        - '${DIR}/*.tf'
        - '${DIR}/*.tfvars'
        - '${DIR}/*.hcl'
        - 'infrastructure/modules/foundation/*.tf'
        - '.terrateam/config.yml'

  infrastructure/prod/foundation:
    tags: [aws, prod, foundation]
    when_modified:
      autoapply: false
      depends_on:
        tag_query: 'dir:infrastructure/dev/foundation'
        prune_on_no_change: true
      file_patterns:
        - '${DIR}/*.tf'
        - '${DIR}/*.tfvars'
        - '${DIR}/*.hcl'
        - 'infrastructure/modules/foundation/*.tf'
        - '.terrateam/config.yml'

workflows:
  - tag_query: 'dev'
    environment: infra/foundation-dev
    plan:
      - type: oidc
        provider: aws
        role_arn: '${DEV_TERRATEAM_ROLE_ARN}'
      - type: init
        extra_args:
          - '-backend-config=bucket=${DEV_TOFU_STATE_BUCKET}'
          - '-backend-config=region=${DEV_AWS_REGION}'
      - type: env
        name: TF_VAR_aws_region
        cmd: ['echo', '${DEV_AWS_REGION}']
      - type: env
        name: TF_VAR_github_oidc_subject_repository
        cmd: ['echo', '${MCC_GITHUB_OIDC_SUBJECT_REPOSITORY}']
      - type: env
        name: TF_VAR_email_domain
        cmd: ['echo', '${DEV_MCC_EMAIL_DOMAIN}']
      - type: plan
    apply:
      - type: oidc
        provider: aws
        role_arn: '${DEV_TERRATEAM_ROLE_ARN}'
      - type: init
        extra_args:
          - '-backend-config=bucket=${DEV_TOFU_STATE_BUCKET}'
          - '-backend-config=region=${DEV_AWS_REGION}'
      - type: env
        name: TF_VAR_aws_region
        cmd: ['echo', '${DEV_AWS_REGION}']
      - type: env
        name: TF_VAR_github_oidc_subject_repository
        cmd: ['echo', '${MCC_GITHUB_OIDC_SUBJECT_REPOSITORY}']
      - type: env
        name: TF_VAR_email_domain
        cmd: ['echo', '${DEV_MCC_EMAIL_DOMAIN}']
      - type: apply

  - tag_query: 'prod'
    environment: infra/foundation-prod
    plan:
      - type: oidc
        provider: aws
        role_arn: '${PROD_TERRATEAM_ROLE_ARN}'
      - type: init
        extra_args:
          - '-backend-config=bucket=${PROD_TOFU_STATE_BUCKET}'
          - '-backend-config=region=${PROD_AWS_REGION}'
      - type: env
        name: TF_VAR_aws_region
        cmd: ['echo', '${PROD_AWS_REGION}']
      - type: env
        name: TF_VAR_github_oidc_subject_repository
        cmd: ['echo', '${MCC_GITHUB_OIDC_SUBJECT_REPOSITORY}']
      - type: env
        name: TF_VAR_email_domain
        cmd: ['echo', '${PROD_MCC_EMAIL_DOMAIN}']
      - type: plan
    apply:
      - type: oidc
        provider: aws
        role_arn: '${PROD_TERRATEAM_ROLE_ARN}'
      - type: init
        extra_args:
          - '-backend-config=bucket=${PROD_TOFU_STATE_BUCKET}'
          - '-backend-config=region=${PROD_AWS_REGION}'
      - type: env
        name: TF_VAR_aws_region
        cmd: ['echo', '${PROD_AWS_REGION}']
      - type: env
        name: TF_VAR_github_oidc_subject_repository
        cmd: ['echo', '${MCC_GITHUB_OIDC_SUBJECT_REPOSITORY}']
      - type: env
        name: TF_VAR_email_domain
        cmd: ['echo', '${PROD_MCC_EMAIL_DOMAIN}']
      - type: apply
