engine:
  name: tofu
  version: 1.12.1

destination_branches:
  - main

# Module dependencies are mapped by hand in each root's file_patterns. See AGENTS.md.
indexer:
  enabled: false

drift:
  enabled: true
  schedules:
    foundation:
      tag_query: 'foundation'
      schedule: weekly

# Foundation changes are applied from the pull request. Dev plans when the pull
# request opens or changes and is applied by comment. Prod plans only after the
# dev apply succeeds and is also applied by comment. Nothing applies from main.
# A root stays locked from its first apply until the pull request merges, and
# Terrateam merges it only after the prod apply succeeds.
lock_policy: strict

automerge:
  enabled: true
  require_explicit_apply: true
  merge_strategy: squash
  retain_pr_title: true

hooks:
  plan:
    post:
      - type: drift_create_issue

access_control:
  enabled: true
  ci_config_update: ['role:admin']
  terrateam_config_update: ['role:admin']
  unlock: ['role:admin']
  policies:
    - tag_query: 'dev'
      plan: ['*']
      apply: ['role:write', 'role:maintain', 'role:admin']
    - tag_query: 'prod'
      plan: ['*']
      apply: ['role:admin']

dirs:
  # Foundation roots also watch this file because it sets their backend and inputs.
  # Bootstrap stays manual.
  infrastructure/dev/bootstrap:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  infrastructure/prod/bootstrap:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  # Modules are not roots. Without these entries Terrateam would plan them with its
  # default workflow, and access control would reject them as untagged.
  infrastructure/modules/bootstrap:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  infrastructure/modules/data-platform:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  infrastructure/modules/foundation:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  # Data platform roots stay out of Terrateam until they are activated.
  infrastructure/dev/data-platform:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  infrastructure/prod/data-platform:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  infrastructure/dev/foundation:
    tags: [aws, dev, foundation]
    when_modified:
      autoapply: false
      file_patterns:
        - '${DIR}/*.tf'
        - '${DIR}/*.tfvars'
        - '${DIR}/*.hcl'
        - 'infrastructure/modules/foundation/*.tf'
        - '.terrateam/config.yml'

  infrastructure/prod/foundation:
    tags: [aws, prod, foundation]
    when_modified:
      autoapply: false
      depends_on:
        tag_query: 'dir:infrastructure/dev/foundation'
      file_patterns:
        - '${DIR}/*.tf'
        - '${DIR}/*.tfvars'
        - '${DIR}/*.hcl'
        - 'infrastructure/modules/foundation/*.tf'
        - '.terrateam/config.yml'

# Workflow steps are defined once here and composed below. Every Terrateam init
# uses the committed provider lock file and fails when it is stale.
definitions:
  lockfile_readonly: &lockfile_readonly '-lockfile=readonly'
  oidc_subject_repository: &oidc_subject_repository
    type: env
    name: TF_VAR_github_oidc_subject_repository
    cmd: ['echo', '${MCC_GITHUB_OIDC_SUBJECT_REPOSITORY}']
  dev_oidc: &dev_oidc
    type: oidc
    provider: aws
    role_arn: '${DEV_TERRATEAM_ROLE_ARN}'
  dev_init: &dev_init
    type: init
    extra_args:
      - *lockfile_readonly
      - '-backend-config=bucket=${DEV_TOFU_STATE_BUCKET}'
      - '-backend-config=region=${DEV_AWS_REGION}'
  dev_aws_region: &dev_aws_region
    type: env
    name: TF_VAR_aws_region
    cmd: ['echo', '${DEV_AWS_REGION}']
  dev_email_domain: &dev_email_domain
    type: env
    name: TF_VAR_email_domain
    cmd: ['echo', '${DEV_MCC_EMAIL_DOMAIN}']
    sensitive: true
  prod_oidc: &prod_oidc
    type: oidc
    provider: aws
    role_arn: '${PROD_TERRATEAM_ROLE_ARN}'
  prod_init: &prod_init
    type: init
    extra_args:
      - *lockfile_readonly
      - '-backend-config=bucket=${PROD_TOFU_STATE_BUCKET}'
      - '-backend-config=region=${PROD_AWS_REGION}'
  prod_aws_region: &prod_aws_region
    type: env
    name: TF_VAR_aws_region
    cmd: ['echo', '${PROD_AWS_REGION}']
  prod_email_domain: &prod_email_domain
    type: env
    name: TF_VAR_email_domain
    cmd: ['echo', '${PROD_MCC_EMAIL_DOMAIN}']
    sensitive: true

workflows:
  - tag_query: 'dev'
    environment: infra/foundation-dev
    plan:
      - *dev_oidc
      - *dev_init
      - *dev_aws_region
      - *oidc_subject_repository
      - *dev_email_domain
      - type: plan
    apply:
      - *dev_oidc
      - *dev_init
      - *dev_aws_region
      - *oidc_subject_repository
      - *dev_email_domain
      - type: apply

  - tag_query: 'prod'
    environment: infra/foundation-prod
    plan:
      - *prod_oidc
      - *prod_init
      - *prod_aws_region
      - *oidc_subject_repository
      - *prod_email_domain
      - type: plan
    apply:
      - *prod_oidc
      - *prod_init
      - *prod_aws_region
      - *oidc_subject_repository
      - *prod_email_domain
      - type: apply
