engine:
  name: tofu
  version: 1.12.1

destination_branches:
  - main

# Module dependencies are mapped by hand in each root's file_patterns. See AGENTS.md.
indexer:
  enabled: false

# Drift runs daily and never reconciles. A secret that feeds a foundation root
# and changed without an external-inputs.revision pull request shows up as a
# drift issue within a day and is never applied without review.
drift:
  enabled: true
  schedules:
    foundation:
      tag_query: 'foundation'
      schedule: daily

# Foundation roots run only on request. Opening or updating a pull request plans
# nothing; a `terrateam plan` comment plans dev, and dev is applied by comment.
# Prod plans only after the dev apply succeeds and is also applied by comment.
# Nothing applies from main. A root is locked only when Terrateam applies it, and
# the lock is released when the pull request merges, so merging a pull request
# that Terrateam never applied takes no lock. Terrateam merges the pull request
# only after every planned root has applied.
lock_policy: apply

automerge:
  enabled: true
  require_explicit_apply: true
  merge_strategy: squash
  retain_pr_title: true

hooks:
  plan:
    post:
      - type: drift_create_issue

access_control:
  enabled: true
  ci_config_update: ['role:admin']
  terrateam_config_update: ['role:admin']
  unlock: ['role:admin']
  policies:
    - tag_query: 'dev'
      plan: ['*']
      apply: ['role:write', 'role:maintain', 'role:admin']
    - tag_query: 'prod'
      plan: ['*']
      apply: ['role:admin']

dirs:
  # Foundation roots also watch this file because it sets their backend and inputs.
  # Bootstrap stays manual.
  infrastructure/dev/bootstrap:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  infrastructure/prod/bootstrap:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  # Modules are not roots. Without these entries Terrateam would plan them with its
  # default workflow, and access control would reject them as untagged.
  infrastructure/modules/bootstrap:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  infrastructure/modules/data-platform:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  infrastructure/modules/foundation:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  # Data platform roots stay out of Terrateam until they are activated.
  infrastructure/dev/data-platform:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  infrastructure/prod/data-platform:
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns: ['!**/*']

  infrastructure/dev/foundation:
    tags: [aws, dev, foundation]
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns:
        - '${DIR}/*.tf'
        - '${DIR}/*.tfvars'
        - '${DIR}/*.hcl'
        - '${DIR}/external-inputs.revision'
        - 'infrastructure/modules/foundation/*.tf'
        - '.terrateam/config.yml'

  # Dev only. The stack's template and stack policy are files in the root, so a
  # regenerated template affects it.
  infrastructure/dev/local-cdk:
    tags: [aws, dev, local-cdk]
    when_modified:
      autoplan: false
      autoapply: false
      file_patterns:
        - '${DIR}/*.tf'
        - '${DIR}/*.tfvars'
        - '${DIR}/*.hcl'
        - '${DIR}/bootstrap-template.json'
        - '${DIR}/stack-policy.json'
        - '.terrateam/config.yml'

  infrastructure/prod/foundation:
    tags: [aws, prod, foundation]
    when_modified:
      autoplan: false
      autoapply: false
      depends_on:
        tag_query: 'dir:infrastructure/dev/foundation'
      file_patterns:
        - '${DIR}/*.tf'
        - '${DIR}/*.tfvars'
        - '${DIR}/*.hcl'
        - '${DIR}/external-inputs.revision'
        - 'infrastructure/modules/foundation/*.tf'
        - '.terrateam/config.yml'

# Workflow steps are defined once here and composed below. Every Terrateam init
# uses the committed provider lock file and fails when it is stale.
#
# GitHub holds only the account IDs, email domains, and email aliases, as
# repository secrets, and the Regions, as repository variables. The role ARN
# and the state bucket follow the bootstrap naming rules and are built from
# them. The runner
# substitutes $NAME and ${NAME} in role_arn, extra_args, and every cmd element
# before anything runs, fails on an undefined name, and rejects shell syntax
# such as $(...) or ${NAME#...}, so a cmd here must contain no other `$`.
definitions:
  lockfile_readonly: &lockfile_readonly '-lockfile=readonly'
  # <owner>@<owner_id>/<repo>@<repo_id> from the runner's default variables.
  # GITHUB_REPOSITORY is <owner>/<repo>; sed drops its <owner>/ prefix.
  oidc_subject_repository: &oidc_subject_repository
    type: env
    name: TF_VAR_github_oidc_subject_repository
    cmd:
      - 'sh'
      - '-c'
      - 'echo "${GITHUB_REPOSITORY_OWNER}@${GITHUB_REPOSITORY_OWNER_ID}/${GITHUB_REPOSITORY}@${GITHUB_REPOSITORY_ID}" | sed "s|/[^/]*/|/|"'
  dev_oidc: &dev_oidc
    type: oidc
    provider: aws
    role_arn: 'arn:aws:iam::${DEV_AWS_ACCOUNT_ID}:role/mcc-stats-suite-dev-terrateam'
  dev_init: &dev_init
    type: init
    extra_args:
      - *lockfile_readonly
      - '-backend-config=bucket=mcc-stats-suite-tofu-state-${DEV_AWS_ACCOUNT_ID}-${DEV_AWS_REGION}'
      - '-backend-config=region=${DEV_AWS_REGION}'
  dev_aws_region: &dev_aws_region
    type: env
    name: TF_VAR_aws_region
    cmd: ['echo', '${DEV_AWS_REGION}']
  dev_email_domain: &dev_email_domain
    type: env
    name: TF_VAR_email_domain
    cmd: ['echo', '${DEV_MCC_EMAIL_DOMAIN}']
    sensitive: true
  dev_email_alias: &dev_email_alias
    type: env
    name: TF_VAR_email_alias
    cmd: ['echo', '${DEV_MCC_EMAIL_ALIAS}']
    sensitive: true
  prod_oidc: &prod_oidc
    type: oidc
    provider: aws
    role_arn: 'arn:aws:iam::${PROD_AWS_ACCOUNT_ID}:role/mcc-stats-suite-prod-terrateam'
  prod_init: &prod_init
    type: init
    extra_args:
      - *lockfile_readonly
      - '-backend-config=bucket=mcc-stats-suite-tofu-state-${PROD_AWS_ACCOUNT_ID}-${PROD_AWS_REGION}'
      - '-backend-config=region=${PROD_AWS_REGION}'
  prod_aws_region: &prod_aws_region
    type: env
    name: TF_VAR_aws_region
    cmd: ['echo', '${PROD_AWS_REGION}']
  prod_email_domain: &prod_email_domain
    type: env
    name: TF_VAR_email_domain
    cmd: ['echo', '${PROD_MCC_EMAIL_DOMAIN}']
    sensitive: true
  prod_email_alias: &prod_email_alias
    type: env
    name: TF_VAR_email_alias
    cmd: ['echo', '${PROD_MCC_EMAIL_ALIAS}']
    sensitive: true

workflows:
  - tag_query: 'dev'
    environment: infra/foundation-dev
    plan:
      - *dev_oidc
      - *dev_init
      - *dev_aws_region
      - *oidc_subject_repository
      - *dev_email_domain
      - *dev_email_alias
      - type: plan
    apply:
      - *dev_oidc
      - *dev_init
      - *dev_aws_region
      - *oidc_subject_repository
      - *dev_email_domain
      - *dev_email_alias
      - type: apply

  - tag_query: 'prod'
    environment: infra/foundation-prod
    plan:
      - *prod_oidc
      - *prod_init
      - *prod_aws_region
      - *oidc_subject_repository
      - *prod_email_domain
      - *prod_email_alias
      - type: plan
    apply:
      - *prod_oidc
      - *prod_init
      - *prod_aws_region
      - *oidc_subject_repository
      - *prod_email_domain
      - *prod_email_alias
      - type: apply
